name: Run

on:
  workflow_dispatch:
    inputs:
      run_description:
        description: 'description'
        required: false
        default: nightly
  push:
    branches:
      - run
    paths:
      - trigger/*

# Cancel any previous run on this branch — only one tunnel at a time.
concurrency:
  group: run-tunnel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: run

    - name: Setup Git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Check Region
      run: |
        REGION_INFO=$(curl -s ipinfo.io || echo '{"region":"unknown","city":"unknown","country":"unknown","ip":"unknown"}')
        REGION=$(echo "$REGION_INFO" | jq -r '.region')
        CITY=$(echo "$REGION_INFO" | jq -r '.city')
        COUNTRY=$(echo "$REGION_INFO" | jq -r '.country')
        echo "Runner location: $CITY, $REGION, $COUNTRY"

        mkdir -p github_run
        echo "$REGION_INFO" > github_run/region.json

        # Blacklist: known-bad regions — skip and commit signal
        BAD_REGIONS=("Virginia", "Arizona", "Wyoming")
        for bad in "${BAD_REGIONS[@]}"; do
          if [ "$REGION" = "$bad" ]; then
            echo "SKIP=true" >> $GITHUB_ENV
            echo "BAD REGION: $CITY, $REGION — skipping server, committing signal"
            git add github_run/region.json
            git commit -m "Auto-update: bad region ($CITY, $REGION)" || true
            git pull --rebase origin run || true
            git push origin run
            exit 0
          fi
        done

        # Whitelist: known-good regions
        IS_KNOWN=false
        GOOD_REGIONS=("Iowa" "California")
        for good in "${GOOD_REGIONS[@]}"; do
          if [ "$REGION" = "$good" ]; then
            IS_KNOWN=true
            break
          fi
        done

        if $IS_KNOWN; then
          echo "Known-good region ($CITY, $REGION). Continuing..."
        else
          echo "UNKNOWN REGION: $CITY, $REGION, $COUNTRY — continuing but should be reviewed"
          echo "Add to whitelist or blacklist in .github/workflows/run.yml"
        fi

    - name: Install Cloudflared
      if: env.SKIP != 'true'
      run: |
        wget https://github.com/cloudflare/cloudflared/releases/download/2026.7.1/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        sudo sysctl -w net.core.rmem_max=7500000
        sudo sysctl -w net.core.wmem_max=7500000
    - name: Install Wireguard
      if: env.SKIP != 'true'
      run: |
        sudo apt-get install -y wireguard
    - name: Configure Wireguard
      if: env.SKIP != 'true'
      run: |
        echo "${{ secrets.WIREGUARD_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf
      shell: bash
    - name: Start Wireguard
      if: env.SKIP != 'true'
      run: |
          # sudo sysctl -w net.ipv4.ip_forward=1
          sudo wg-quick up wg0
          ifconfig
          sysctl net.ipv4.ip_forward
          sudo iptables -t nat -L

    - name: Configure DNS
      if: env.SKIP != 'true'
      run: |
        echo "DNSStubListener=yes" | sudo tee -a /etc/systemd/resolved.conf
        echo "DNSStubListenerExtra=0.0.0.0" | sudo tee -a /etc/systemd/resolved.conf
        sudo systemctl restart systemd-resolved

    - name: Install Server
      if: env.SKIP != 'true'
      run: |
       wget https://github.com/xiguichen/tcpudp/releases/download/v1.1.16/tcpudp-ubuntu-latest.tar.gz
       ls
       tar xvf tcpudp-ubuntu-latest.tar.gz
       chmod +x tcpudp-ubuntu-latest/server
    - name: Start Server (background)
      if: env.SKIP != 'true'
      run: |
        # Start server first so the port is listening when cloudflared connects
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Starting server..."
        chmod +x tcpudp-ubuntu-latest/server
        nohup tcpudp-ubuntu-latest/server > server.log 2>&1 &
        SERVER_PID=$!
        echo "Server PID: $SERVER_PID"
        # Save PID so the foreground step can monitor it
        echo "$SERVER_PID" > /tmp/server_pid
    - name: Run Cloudflared
      if: env.SKIP != 'true'
      run: |
        cloudflared tunnel --url tcp://localhost:7001 --logfile cloudflare.log </dev/null >/dev/null 2>&1 &
        CLOUDFLARED_PID=$!
        echo "$CLOUDFLARED_PID" > /tmp/cloudflared_pid
        date +%s > /tmp/cloudflared_start
        until grep -q "https.*trycloudflare.com" cloudflare.log 2>/dev/null; do sleep 1; done
        HOSTNAME=$(cat cloudflare.log | grep -o "https.*trycloudflare.com")
        HOSTNAME_BARE=$(echo "$HOSTNAME" | sed 's|https://||')
        mkdir -p ${{ github.workspace }}/github_run
        echo -n "cloudflared access tcp --url tcp://localhost:7001 --hostname " > ${{ github.workspace }}/github_run/cloudflare.sh
        echo "$HOSTNAME_BARE" >> ${{ github.workspace }}/github_run/cloudflare.sh
        cp ${{ github.workspace }}/github_run/cloudflare.sh ${{ github.workspace }}/github_run/cloudflare.bat
        chmod +x ${{ github.workspace }}/github_run/cloudflare.sh
        # Backward compat: also write to root
        cp ${{ github.workspace }}/github_run/cloudflare.sh ${{ github.workspace }}/cloudflare.sh
        cp ${{ github.workspace }}/github_run/cloudflare.bat ${{ github.workspace }}/cloudflare.bat
        # Write machine-readable run info
        echo "{\"hostname\":\"$HOSTNAME\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"port\":7001}" > ${{ github.workspace }}/github_run/run_info.json
        echo "Cloudflared tunnel registered: $HOSTNAME"
        echo "HOSTNAME=$HOSTNAME" >> $GITHUB_ENV
        echo "HOSTNAME_BARE=$HOSTNAME_BARE" >> $GITHUB_ENV
    - name: Ping Cloudflare Edge
      if: env.SKIP != 'true'
      run: |
        echo "=== Ping to tunnel hostname: ${{ env.HOSTNAME_BARE }} ==="
        ping -c 10 ${{ env.HOSTNAME_BARE }} || true
        echo ""
        echo "=== Ping to Cloudflare Edge IP (162.159.38.209) for comparison ==="
        ping -c 10 162.159.38.209 || true
    - name: Commit Change
      if: env.SKIP != 'true'
      working-directory: ${{ github.workspace }}
      run: |
          git add github_run/ cloudflare.sh cloudflare.bat
          git commit -m "Auto-update cloudflare tunnel info" || true
          git pull --rebase origin run || true
          git push origin run
     

    - name: Keep Services Alive
      if: env.SKIP != 'true'
      run: |
        tail -f cloudflare.log -f server.log &
        # Monitor and restart server + cloudflared so the tunnel stays up.
        while true; do
          # --- Server ---
          SERVER_PID=$(cat /tmp/server_pid 2>/dev/null || echo "")
          if [ -n "$SERVER_PID" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
            true
          else
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Server not running. Restarting..."
            nohup tcpudp-ubuntu-latest/server > server.log 2>&1 &
            echo $! > /tmp/server_pid
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Server restarted (PID $!)"
          fi

          # --- Cloudflared ---
          # Restart if PID dies. HTTP/2 transport avoids QUIC blocking.
          CF_PID=$(cat /tmp/cloudflared_pid 2>/dev/null || echo "")
          SHOULD_RESTART=false
          if [ -z "$CF_PID" ] || ! kill -0 "$CF_PID" 2>/dev/null; then
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Cloudflared PID dead. Restarting..."
            SHOULD_RESTART=true
          fi
          if $SHOULD_RESTART; then
            # Truncate old log so grep works on fresh output
            : > cloudflare.log
            cloudflared tunnel --url http://localhost:7001 --logfile cloudflare.log </dev/null >/dev/null 2>&1 &
            CF_PID=$!
            echo "$CF_PID" > /tmp/cloudflared_pid
            date +%s > /tmp/cloudflared_start
            # Wait for new hostname
            for i in $(seq 1 30); do
              if grep -q "https.*trycloudflare.com" cloudflare.log 2>/dev/null; then break; fi
              sleep 1
            done
            HOSTNAME=$(grep -o "https.*trycloudflare.com" cloudflare.log 2>/dev/null || echo "")
            if [ -z "$HOSTNAME" ]; then
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) Cloudflared failed to get hostname. Will retry."
              continue
            fi
            HOSTNAME_BARE=$(echo "$HOSTNAME" | sed 's|https://||')
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) New tunnel: $HOSTNAME"
            # Update cloudflare.sh with new hostname
            mkdir -p ${{ github.workspace }}/github_run
            echo -n "cloudflared access tcp --url tcp://localhost:7001 --hostname " > ${{ github.workspace }}/github_run/cloudflare.sh
            echo "$HOSTNAME_BARE" >> ${{ github.workspace }}/github_run/cloudflare.sh
            cp ${{ github.workspace }}/github_run/cloudflare.sh ${{ github.workspace }}/github_run/cloudflare.bat
            cp ${{ github.workspace }}/github_run/cloudflare.sh ${{ github.workspace }}/cloudflare.sh
            cp ${{ github.workspace }}/github_run/cloudflare.bat ${{ github.workspace }}/cloudflare.bat
            echo "{\"hostname\":\"$HOSTNAME\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"port\":7001}" > ${{ github.workspace }}/github_run/run_info.json
            # Push updated hostname so clients can pick it up
            cd ${{ github.workspace }}
            git add github_run/ cloudflare.sh cloudflare.bat
            git commit -m "Auto-update cloudflare tunnel info" || true
            git pull --rebase origin run || true
            git push origin run || echo "Push failed — will retry on next restart"
          fi

          sleep 5
        done
