services:
  - type: web
    # Must match the hostname baked into trigger_render.sh's default
    # RENDER_HEALTH_URL, or that script polls a 404 on first use.
    # test_trigger_render.sh asserts the two agree.
    name: tcpudp
    runtime: docker
    # Everything this service needs lives in render/. Render hides the rest of
    # the repo from the build, which is what keeps the folder liftable.
    rootDir: render
    plan: free
    # Immutable after creation. Oregon because run.yml blacklists Virginia.
    region: oregon
    branch: run
    # Off is load-bearing. On, a supervisor publish would redeploy, which would
    # wipe the filesystem, which would mint a new tunnel hostname, which would
    # publish again - forever.
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    envVars:
      - key: TCPUDP_RELEASE
        value: v1.1.16
      - key: TCPUDP_SERVER_PORT
        value: "7001"
      - key: TCPUDP_REPO_DIR
        value: /app/repo
      - key: TCPUDP_INFO_DIR
        value: github_run
      - key: SUPERVISE_INTERVAL
        value: "5"
      - key: TUNNEL_START_TIMEOUT
        value: "60"
      # Leave blank to run without it. The tunnel and /healthz still work;
      # trigger_render.sh reads the live hostname from /healthz instead of
      # from git. Set it only if something other than this Mac needs the
      # hostname to land in the repo. Fine-grained token, contents:write.
      - key: GITHUB_PAT
        sync: false
      # The contents of a wg0.conf. Leave blank to skip WireGuard entirely.
      # Set it to route the server's and cloudflared's egress through the
      # tunnel - the whole config is needed, not just the keys, because
      # wg-quick derives the routing from AllowedIPs. For 0.0.0.0/0 the default
      # route moves onto the interface, which is what makes egress tunnelled.
      # The supervisor reports in /healthz and the log whether the interface
      # came up AND whether the default route actually traverses it.
      - key: WIREGUARD_CONFIG
        sync: false
      # Set true to make a WireGuard failure fatal instead of a warning. Leave
      # false so a host that cannot create a TUN device still serves /healthz
      # and the failure stays diagnosable.
      - key: WIREGUARD_REQUIRED
        value: "false"
