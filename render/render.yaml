services:
  - type: web
    # Must match the hostname baked into trigger_render.sh's default
    # RENDER_HEALTH_URL, or that script polls a 404 on first use.
    # test_trigger_render.sh asserts the two agree.
    name: tcpudp
    runtime: docker
    # Everything this service needs lives in render/. Render hides the rest of
    # the repo from the build, which is what keeps the folder liftable.
    rootDir: render
    plan: free
    # Immutable after creation. Oregon because run.yml blacklists Virginia.
    region: oregon
    branch: run
    # On, so every push to `run` deploys and the new instance is live a few
    # minutes later. Safe only while GITHUB_PAT is blank: publish() then writes
    # the info files but never commits, so nothing but our own pushes can
    # trigger a build. Set a PAT and the loop returns - a publish would
    # redeploy, wipe the filesystem, mint a new hostname, and publish again,
    # forever.
    autoDeployTrigger: 'on'
    healthCheckPath: /healthz
    envVars:
      - key: TCPUDP_PROXY_PORT
        value: "8080"
      - key: TCPUDP_PROXY_BIND
        value: 0.0.0.0
      - key: TCPUDP_REPO_DIR
        value: /app/repo
      - key: TCPUDP_INFO_DIR
        value: github_run
      - key: SUPERVISE_INTERVAL
        value: "5"
      - key: TUNNEL_START_TIMEOUT
        value: "60"
      # Leave blank to run without it. The tunnel and /healthz still work;
      # trigger_render.sh reads the live hostname from /healthz instead of
      # from git. Set it only if something other than this Mac needs the
      # hostname to land in the repo. Fine-grained token, contents:write.
      - key: GITHUB_PAT
        sync: false
